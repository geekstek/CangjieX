name: Release

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching the app Info.plist, for example 2.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: Portable Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/core
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' ../rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Verify core
        run: |
          cargo fmt --check
          cargo test --locked --offline
          cargo clippy --locked --offline --all-targets -- -D warnings

  release:
    name: Verify and publish universal Swift/Rust installer
    needs: rust
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            version="${REQUESTED_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "${version}" =~ ^2\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=v${version}" >>"${GITHUB_OUTPUT}"
      - name: Install pinned Rust and cross-compile target
        shell: bash
        run: |
          make migration-toolchain
          architecture=$(uname -m)
          if [[ "${architecture}" == arm64 ]]; then target=x86_64-apple-darwin; else target=aarch64-apple-darwin; fi
          CARGO_HOME="$PWD/.source/migration/cargo" RUSTUP_HOME="$PWD/.source/migration/rustup" \
            .source/migration/cargo/bin/rustup target add "${target}"
      - name: Verify data, original C++ baselines, Rust and native Swift
        run: |
          make migration-check
          make migration-preview-check
      - name: Build and inspect per-user installer
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: make migration-package
      - name: Preserve verified installer
        uses: actions/upload-artifact@v4
        with:
          name: CangjieX-${{ steps.release.outputs.version }}-universal
          path: |
            build/migration/release/CangjieX-*.pkg
            build/migration/release/CangjieX-*.sha256
            build/migration/release/build-info.json
          if-no-files-found: error
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "${TAG_NAME}" \
            "build/migration/release/CangjieX-${VERSION}-universal.pkg" \
            "build/migration/release/CangjieX-${VERSION}-universal.pkg.sha256" \
            build/migration/release/build-info.json \
            --verify-tag --target "${GITHUB_SHA}" --draft \
            --title "倉頡星 V${VERSION}" \
            --notes-file migration/release/RELEASE-NOTES.md
          gh release edit "${TAG_NAME}" --draft=false --latest
