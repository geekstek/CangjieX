name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Verify universal per-user installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust toolchain and cross-compile target
        run: |
          make migration-toolchain
          architecture=$(uname -m)
          if [[ "${architecture}" == arm64 ]]; then target=x86_64-apple-darwin; else target=aarch64-apple-darwin; fi
          CARGO_HOME="$PWD/.source/migration/cargo" RUSTUP_HOME="$PWD/.source/migration/rustup" \
            .source/migration/cargo/bin/rustup target add "${target}"
      - name: Build and verify package
        run: make migration-package
      - uses: actions/upload-artifact@v4
        with:
          name: CangjieX-universal-installer
          path: |
            build/migration/release/CangjieX-*.pkg
            build/migration/release/CangjieX-*.sha256
            build/migration/release/build-info.json
          if-no-files-found: error
          retention-days: 7
