<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>啟用倉頡星</title><body>
<h1>安裝完成</h1>
<p>請先保存工作，在方便時登出並重新登入。</p>
<p>開啟「系統設定 → 鍵盤 → 文字輸入 → 編輯 → ＋ → 繁體中文」，加入「CangjieX Preview／倉頡星 Preview」，再從輸入選單選取它。</p>
<p>已有 Preview 輸入源時，重新登入後選取原有項目即可，不需重複加入。舊版倉頡星保持不變，可隨時切回。</p>
<p>「依選字習慣調整候選順序」可在 Preview 的「偏好設定 → 輸入」開啟。倉頡與簡易分開保存設定與學習記錄。</p>
</body></html>
